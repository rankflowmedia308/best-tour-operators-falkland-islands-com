<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 56" width="300" height="56">
  <!-- Penguin mark — designed for dark backgrounds -->
  <g transform="translate(0,2)">
    <!-- Body -->
    <ellipse cx="26" cy="35" rx="13" ry="16" fill="rgba(255,255,255,0.92)"/>
    <!-- Belly — mid-navy for contrast against white body -->
    <ellipse cx="26" cy="37" rx="7.5" ry="12" fill="#1b3a5c"/>
    <!-- Head -->
    <circle cx="26" cy="16" r="11" fill="rgba(255,255,255,0.92)"/>
    <!-- Face patch -->
    <ellipse cx="26" cy="18.5" rx="6.5" ry="7.5" fill="#1b3a5c"/>
    <!-- Eyes -->
    <circle cx="23.2" cy="15" r="2" fill="rgba(255,255,255,0.92)"/>
    <circle cx="28.8" cy="15" r="2" fill="rgba(255,255,255,0.92)"/>
    <circle cx="23.8" cy="14.4" r=".7" fill="#0d1b2a"/>
    <circle cx="29.4" cy="14.4" r=".7" fill="#0d1b2a"/>
    <!-- Beak -->
    <path d="M23.5 21.5 L28.5 21.5 L26 25.5 Z" fill="#c8974a"/>
    <!-- Flippers -->
    <ellipse cx="13" cy="32" rx="4.5" ry="10" fill="rgba(255,255,255,0.75)" transform="rotate(-12,13,32)"/>
    <ellipse cx="39" cy="32" rx="4.5" ry="10" fill="rgba(255,255,255,0.75)" transform="rotate(12,39,32)"/>
    <!-- Feet -->
    <ellipse cx="21.5" cy="50" rx="5" ry="2.5" fill="#c8974a"/>
    <ellipse cx="30.5" cy="50" rx="5" ry="2.5" fill="#c8974a"/>
  </g>
  <!-- Vertical rule -->
  <line x1="58" y1="8" x2="58" y2="48" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
  <!-- Wordmark -->
  <text x="68" y="25" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="700" fill="#ffffff" letter-spacing="0.5">FALKLANDS</text>
  <text x="68" y="43" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="400" fill="#c8974a" letter-spacing="0.5">TOUR GUIDE</text>
  <!-- Tagline -->
  <text x="68.5" y="54" font-family="Arial, Helvetica, sans-serif" font-size="7" font-weight="400" fill="rgba(255,255,255,0.4)" letter-spacing="2.2">INDEPENDENT EDITORIAL RESOURCE</text>
</svg>
